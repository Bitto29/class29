<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e1b"><title>Sign in · Class 29</title><link rel="stylesheet" href="assets/styles.css"><style>.login{max-width:420px;margin:12vh auto;padding:24px}.panel{padding:25px;background:#101b2d;border:1px solid var(--line);border-radius:18px}.field{display:block;margin:20px 0}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.field input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#091321;color:var(--text);font:inherit}.action{width:100%;border:0;border-radius:10px;padding:14px;background:#77a9ff;color:#081321;font:inherit;font-weight:800}.error{color:#ff9c9c;font-size:13px}</style></head><body><main class="login"><div class="brand" style="margin-bottom:24px"><span class="brand-mark">29</span><span>Class <b>29</b></span></div><section class="panel"><div class="eyebrow">PRIVATE STUDY LIBRARY</div><h1 style="font-size:38px;letter-spacing:-1px">Welcome <span>back.</span></h1><p style="color:var(--muted);font-size:13px">Sign in to access your personal Class 29 library.</p><form id="form"><label class="field"><span>Library password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="action">Unlock library</button><p id="error" class="error"></p></form></section></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Sign-in failed');location.replace('/');}catch(x){document.getElementById('error').textContent=x.message;b.disabled=false;}});</script></body></html>
